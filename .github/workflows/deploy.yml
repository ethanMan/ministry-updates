# Builds the site and publishes it to GitHub Pages on every push to main.
# Nothing to run by hand — pushing a new update is the whole workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the first deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Resizing photos is the slow part of the build. Carrying the results
      # between deploys means only newly added photos have to be processed, so
      # a large gallery does not make every deploy slow.
      - name: Restore the cache of resized photos
        uses: actions/cache@v4
        with:
          path: .astro-cache
          key: astro-assets-${{ github.sha }}
          restore-keys: astro-assets-

      - name: Install, build, and upload the site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
